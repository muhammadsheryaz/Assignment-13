<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
    <form action="">
        <h1>User Registration Form</h1>
        <fieldset style="width: 360px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">
            <legend style="color: blueviolet;">Personal Information</legend>
            <table>
                <tr>
                    <th align="left"><label for="name">Name:</label></th>
                    <td><input style="border: 1.5px solid; background-color: rgba(43, 144, 226, 0.135); color: blueviolet; outline: none;" type="text" name="name" id="name"></td>
                </tr>
                    <tr>
                    <th align="left"><label for="email">Email Address:</label></th>
                    <td><input style="border: 1.5px solid; background-color: rgba(43, 144, 226, 0.135); outline: none; color: blueviolet;" type="email" name="email" id="email"></td>
                </tr>
                <tr>
                    <th align="left"><label for="pass">Password:</label></th>
                    <td><input type="password" style="border: 1.5px solid; background-color: rgba(43, 144, 226, 0.135); outline: none; color: blueviolet;" name="pass" id="pass"></td>
                </tr>
                    <tr>
                    <th align="left"><label for="c-pass">Confirm Password:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label></th>
                    <td><input type="password" style="border: 1.5px solid; background-color: rgba(43, 144, 226, 0.135); outline: none; color: blueviolet;" name="c-pass" id="c-pass"></td>
                </tr>
            </table>
        </fieldset>
        <br>

            <fieldset style="width: 360px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">
                <legend style="color: blueviolet;">Address Details</legend>
                <table>
                    <tr>
                        <th align="left"><label for="address-line-1">Address line one:</label></th>
                        <td><input type="text" name="address-line-1" style="border: 1.5px solid; background-color: rgba(43, 144, 226, 0.135); outline: none; color: blueviolet;" id="address-line-1"></td>
                </tr>
                    <tr>
                    <th align="left"><label for="address-line-2">Address line two:</label></th>
                    <td><input type="text" style="border: 1.5px solid; background-color: rgba(43, 144, 226, 0.135); outline: none; color: blueviolet;" name="address-line-2" id="address-line-2"></td>
                </tr>
                <tr>
                    <th align="left"><label for="town-city">Town / City:</labe l></th>
                    <td><input type="text" style="border: 1.5px solid; background-color: rgba(43, 144, 226, 0.135); outline: none; color: blueviolet;" name="town-city" id="town-city"></td>
                </tr>
                    <tr>
                    <th align="left"><label for="z.code">Zip / Post code:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label></th>
                    <td><input type="text" style="border: 1.5px solid;background-color: rgba(43, 144, 226, 0.135); outline: none; color: blueviolet;" name="z.code" id="z.code"></td>
                </tr> 
            </table>
        </fieldset>
        <br>
        <button style="border: 1.5px solid; color: blueviolet;">Sign in</button>
    </form>
</center>
</body>
</html>
